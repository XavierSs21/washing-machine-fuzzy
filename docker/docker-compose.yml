version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: wm_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app   # hot-reload en dev
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - wm_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: wm_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src   # hot-reload en dev
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wm_net

networks:
  wm_net:
    driver: bridge
